<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地球实时日光</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: block;
        }

        .hud-tips {
            display: none;
            position: absolute;
            bottom: 88px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.45);
            font-size: 11px;
            padding: 0 16px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            letter-spacing: 0.5px;
        }
    </style>
    <script src="three.min.js"></script>
    <script src="earth_texture_data.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="hud-tips">
        单指拖动旋转视角 · 双指捏合自由缩放 · 实时模拟全球昼夜晨昏圈
    </div>

    <script>
        const PI = Math.PI;
        const TWO_PI = PI * 2;
        const Sp = -PI;
        const Ep = TWO_PI / 1440;
        const LIGHT_DIST = 5;
        
        // 舒适手机端光学参数：平行直射光 1.35，漫反射环境光 0.6 (夜半球亮度 0.6)
        const LIGHT_INTENSITY = 1.35;
        const AMBIENT_INTENSITY = 0.6;
        
        // 正交相机保持在离球心 10.0 的安全固定距离，缩放纯靠正交视界 ot 调节，永不发生近裁剪面穿模变黑
        const CAMERA_DIST = 10.0;
        const DEFAULT_ZOOM = 1.35;
        const MIN_ZOOM = 0.25;
        const MAX_ZOOM = 3.5;

        let ot = DEFAULT_ZOOM;
        let isTouching = false;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let initialPinchDist = 0;
        let initialZoom = DEFAULT_ZOOM;

        // 默认视角微偏20度（cr = PI/2 + 0.35），开屏即可清晰观察到昼夜半球与晨昏线分割弧线
        let cr = PI / 2 + 0.35;
        let Cn = PI / 2;

        let isSimulating = false;
        let simulatedTime = null;
        let currentWidth = 0;
        let currentHeight = 0;

        // 计算指定日期的太阳赤纬角 (Solar Declination)
        function calculateSolarDeclination(date) {
            const startOfYear = new Date(date.getFullYear(), 0, 0);
            const dayOfYear = Math.floor((date - startOfYear) / (1000 * 60 * 60 * 24));
            return Math.asin(0.398 * Math.cos(TWO_PI * (dayOfYear - 173) / 365.242));
        }

        // Three.js 场景初始化
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
        camera.position.set(0, 0, CAMERA_DIST);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.5));
        container.appendChild(renderer.domElement);

        // 2. 全局环境光 (AmbientLight: 0xffffff, 0.3)
        const ambientLight = new THREE.AmbientLight(0xffffff, AMBIENT_INTENSITY);
        scene.add(ambientLight);

        // 地球与光源容器组 (支持整体倾斜)
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // 3. 太阳平行直射光 (DirectionalLight: 0xffffff, 4.0)
        const sunLight = new THREE.DirectionalLight(0xffffff, LIGHT_INTENSITY);
        sunLight.position.set(0, 0, LIGHT_DIST);
        earthGroup.add(sunLight);

        // 地球球体
        const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
        
        function createProceduralFallbackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.arc(300, 100, 50, 0, Math.PI * 2);
            ctx.arc(150, 90, 40, 0, Math.PI * 2);
            ctx.arc(180, 180, 45, 0, Math.PI * 2);
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        const textureSource = (typeof window.EARTH_TEXTURE_BASE64 !== 'undefined' && window.EARTH_TEXTURE_BASE64)
            ? window.EARTH_TEXTURE_BASE64
            : '2k_earth_daymap.jpg';

        // 层次分明的昼夜立体过渡阴影着色器 (向阳日光充足、晨昏阴影层次立体、夜半球 0.6 清晰可见)
        const earthCustomMaterial = new THREE.ShaderMaterial({
            uniforms: {
                earthTexture: { value: null },
                sunDirection: { value: new THREE.Vector3(0, 0, 1) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormalWorld;
                void main() {
                    vUv = uv;
                    vNormalWorld = normalize(mat3(modelMatrix) * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D earthTexture;
                uniform vec3 sunDirection;
                varying vec2 vUv;
                varying vec3 vNormalWorld;

                void main() {
                    vec4 tex = texture2D(earthTexture, vUv);
                    vec3 N = normalize(vNormalWorld);
                    vec3 L = normalize(sunDirection);

                    float dotNL = dot(N, L);

                    // 1. 严格以 dotNL = 0 为轴对称的 S 型立体阴影衰减（晨昏线大圆严格对应 dotNL = 0.0）
                    float dayFactor = smoothstep(-0.06, 0.06, dotNL);

                    // 2. 晨昏交界晚霞色温微晕（严格以 dotNL = 0.0 为中心对称分布）
                    float twilight = 1.0 - smoothstep(0.0, 0.07, abs(dotNL));
                    vec3 twilightGlow = vec3(0.96, 0.58, 0.20) * twilight * 0.35;

                    // 3. 白昼色彩 (白点值柔和化：采用非线性温润高光压缩，峰值限制在 1.08，温和通透不刺眼)
                    float sunLambert = max(0.0, dotNL);
                    float softHighlight = 0.98 + 0.12 * pow(sunLambert, 1.4);
                    vec3 dayColor = tex.rgb * softHighlight;

                    // 4. 夜半球色彩 (环境光 0.6，清晰明朗且具有清晰暗夜层次)
                    vec3 nightColor = tex.rgb * 0.58 + vec3(0.010, 0.015, 0.030);

                    // 5. 昼夜阴影合成
                    vec3 finalColor = mix(nightColor, dayColor, dayFactor) + twilightGlow;

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        // 贴图加载
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load(
            textureSource,
            function(tex) {
                tex.needsUpdate = true;
                earthCustomMaterial.uniforms.earthTexture.value = tex;
                renderer.render(scene, camera);
            },
            undefined,
            function(err) {
                console.warn('Texture load fallback:', err);
                const fallbackTex = createProceduralFallbackTexture();
                earthCustomMaterial.uniforms.earthTexture.value = fallbackTex;
            }
        );

        const earthMesh = new THREE.Mesh(earthGeometry, earthCustomMaterial);
        earthMesh.position.set(0, 0, 0);
        earthGroup.add(earthMesh);
        sunLight.target = earthMesh;

        // 晨昏线 (黄金光晕大圆圈，精准指示日出与日落交界线)
        const terminatorRingGeom = new THREE.CylinderGeometry(1.002, 1.002, 0.005, 64, 1, true);
        const terminatorMat = new THREE.MeshBasicMaterial({
            color: 0xfbbf24,
            transparent: true,
            opacity: 0.85,
            side: THREE.DoubleSide
        });
        const terminatorRing = new THREE.Mesh(terminatorRingGeom, terminatorMat);
        terminatorRing.position.set(0, 0, 0);
        terminatorRing.visible = false; // 默认不开启晨昏线圈
        earthGroup.add(terminatorRing);

        // 高清大字号文字标注 Sprite 生成函数 (Canvas 384x96, 32px 粗体, 描边清晰醒目)
        function createTextSprite(text, color, scaleW = 0.22, scaleH = 0.055) {
            const canvas = document.createElement('canvas');
            canvas.width = 384;
            canvas.height = 96;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 32px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.95)';
            ctx.lineWidth = 6;
            ctx.strokeText(text, 192, 48);
            ctx.fillStyle = color || '#ffffff';
            ctx.fillText(text, 192, 48);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            const mat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: true,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(scaleW, scaleH, 1.0);
            return sprite;
        }

        // 精确地理经纬度坐标转换 (对齐 Three.js 球体 UV 映射：u=0.5 对应英国格林尼治本初子午线 0°，位于 +X 轴；东经为正 -Z 轴，西经为负 +Z 轴)
        function addLatLabel(group, latDeg, text, color, lngDeg = 0) {
            const phi = (latDeg * Math.PI) / 180;
            const lam = (lngDeg * Math.PI) / 180;
            const R = 1.028;
            const x = R * Math.cos(phi) * Math.cos(lam);
            const y = R * Math.sin(phi);
            const z = -R * Math.cos(phi) * Math.sin(lam);
            const sprite = createTextSprite(text, color, 0.24, 0.06);
            sprite.position.set(x, y, z);
            group.add(sprite);
        }

        function addLngLabel(group, lngDeg, text, color) {
            // 标注在赤道偏北 5°
            const phi = (5 * Math.PI) / 180;
            const lam = (lngDeg * Math.PI) / 180;
            const R = 1.028;
            const x = R * Math.cos(phi) * Math.cos(lam);
            const y = R * Math.sin(phi);
            const z = -R * Math.cos(phi) * Math.sin(lam);
            const sprite = createTextSprite(text, color, 0.18, 0.046);
            sprite.position.set(x, y, z);
            group.add(sprite);
        }

        // 午时线 (半圆环：红色与蓝色两段)
        const meridianRingGeom = new THREE.CylinderGeometry(1.003, 1.003, 0.004, 64, 1, true, 0, PI);
        const redMeridianMat = new THREE.MeshBasicMaterial({ color: 0xff3b30, side: THREE.DoubleSide });
        const blueMeridianMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, side: THREE.DoubleSide });

        const redMeridian = new THREE.Mesh(meridianRingGeom, redMeridianMat);
        redMeridian.rotation.set(PI / 2, 0, PI / 2);
        redMeridian.visible = false;
        earthGroup.add(redMeridian);

        const noonLabel = createTextSprite('正午 12:00', '#ef4444', 0.22, 0.055);
        noonLabel.position.set(0, 0, 1.06);
        noonLabel.visible = false;
        earthGroup.add(noonLabel);

        const blueMeridian = new THREE.Mesh(meridianRingGeom, blueMeridianMat);
        blueMeridian.rotation.set(PI / 2, 0, -PI / 2);
        blueMeridian.visible = false;
        earthGroup.add(blueMeridian);

        const midnightLabel = createTextSprite('子夜 00:00', '#38bdf8', 0.22, 0.055);
        midnightLabel.position.set(0, 0, -1.06);
        midnightLabel.visible = false;
        earthGroup.add(midnightLabel);

        // 地轴 (贯穿南北极的白光轴线)
        const axisGeom = new THREE.CylinderGeometry(0.0025, 0.0025, 2.6, 16, 1, true);
        const axisMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
        const earthAxis = new THREE.Mesh(axisGeom, axisMat);
        earthAxis.position.set(0, 0, 0);
        earthAxis.visible = false;
        earthGroup.add(earthAxis);

        const northPoleLabel = createTextSprite('北极点 (N)', '#ffffff', 0.20, 0.05);
        northPoleLabel.position.set(0, 1.35, 0);
        earthAxis.add(northPoleLabel);

        const southPoleLabel = createTextSprite('南极点 (S)', '#ffffff', 0.20, 0.05);
        southPoleLabel.position.set(0, -1.35, 0);
        earthAxis.add(southPoleLabel);

        // 太阳直射点组 (发光微球 + 光晕环 + 高清文字标注)
        const subsolarGroup = new THREE.Group();
        subsolarGroup.visible = false;

        const subsolarCoreGeom = new THREE.SphereGeometry(0.018, 16, 16);
        const subsolarCoreMat = new THREE.MeshBasicMaterial({ color: 0xfff066 });
        const subsolarCore = new THREE.Mesh(subsolarCoreGeom, subsolarCoreMat);
        subsolarGroup.add(subsolarCore);

        const subsolarHaloGeom = new THREE.RingGeometry(0.024, 0.048, 32);
        const subsolarHaloMat = new THREE.MeshBasicMaterial({
            color: 0xf59e0b,
            transparent: true,
            opacity: 0.85,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const subsolarHalo = new THREE.Mesh(subsolarHaloGeom, subsolarHaloMat);
        subsolarGroup.add(subsolarHalo);

        const subsolarLabel = createTextSprite('太阳直射点', '#fde047', 0.22, 0.055);
        subsolarGroup.add(subsolarLabel);

        earthGroup.add(subsolarGroup);

        // 经纬网格线组 (赤道、南北回归线、南北极圈、每30度经纬度细线，随地球自转)
        const graticuleGroup = new THREE.Group();
        graticuleGroup.visible = false;

        function createLatitudeCircle(latDeg, color, opacity) {
            const phi = (latDeg * Math.PI) / 180;
            const r = Math.cos(phi) * 1.002;
            const y = Math.sin(phi) * 1.002;
            const points = [];
            const segments = 96;
            for (let i = 0; i <= segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(r * Math.cos(theta), y, -r * Math.sin(theta)));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({
                color: color || 0x60a5fa,
                transparent: true,
                opacity: opacity || 0.35,
                depthWrite: false
            });
            return new THREE.Line(geom, mat);
        }

        // 精确经线圈生成 (严格对齐本初子午线 0° 与全球经度大圆)
        function createLongitudeCircle(lngDeg, color, opacity) {
            const lam = (lngDeg * Math.PI) / 180;
            const points = [];
            const segments = 96;
            for (let i = 0; i <= segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                const y = 1.002 * Math.sin(theta);
                const r = 1.002 * Math.cos(theta);
                const x = r * Math.cos(lam);
                const z = -r * Math.sin(lam);
                points.push(new THREE.Vector3(x, y, z));
            }
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({
                color: color || 0x60a5fa,
                transparent: true,
                opacity: opacity || 0.35,
                depthWrite: false
            });
            return new THREE.Line(geom, mat);
        }

        // 赤道 (0° 纬线：青蓝色微亮)
        graticuleGroup.add(createLatitudeCircle(0, 0x38bdf8, 0.70));
        addLatLabel(graticuleGroup, 0, '赤道 0°', '#38bdf8', 0);
        addLatLabel(graticuleGroup, 0, '赤道 0°', '#38bdf8', 120);
        addLatLabel(graticuleGroup, 0, '赤道 0°', '#38bdf8', -120);

        // 南北回归线 (±23.44°：温和淡黄)
        graticuleGroup.add(createLatitudeCircle(23.44, 0xfde047, 0.50));
        graticuleGroup.add(createLatitudeCircle(-23.44, 0xfde047, 0.50));
        addLatLabel(graticuleGroup, 23.44, '北回归线 23.5°N', '#fde047', 0);
        addLatLabel(graticuleGroup, 23.44, '北回归线 23.5°N', '#fde047', 120);
        addLatLabel(graticuleGroup, -23.44, '南回归线 23.5°S', '#fde047', 0);
        addLatLabel(graticuleGroup, -23.44, '南回归线 23.5°S', '#fde047', 120);

        // 南北极圈 (±66.56°：淡蓝细线)
        graticuleGroup.add(createLatitudeCircle(66.56, 0x93c5fd, 0.40));
        graticuleGroup.add(createLatitudeCircle(-66.56, 0x93c5fd, 0.40));
        addLatLabel(graticuleGroup, 66.56, '北极圈 66.5°N', '#93c5fd', 0);
        addLatLabel(graticuleGroup, -66.56, '南极圈 66.5°S', '#93c5fd', 0);

        // 中纬线 (±30°, ±60°)
        graticuleGroup.add(createLatitudeCircle(30, 0x60a5fa, 0.30));
        graticuleGroup.add(createLatitudeCircle(-30, 0x60a5fa, 0.30));
        graticuleGroup.add(createLatitudeCircle(60, 0x60a5fa, 0.30));
        graticuleGroup.add(createLatitudeCircle(-60, 0x60a5fa, 0.30));
        addLatLabel(graticuleGroup, 30, '30°N', '#93c5fd', 0);
        addLatLabel(graticuleGroup, -30, '30°S', '#93c5fd', 0);
        addLatLabel(graticuleGroup, 60, '60°N', '#93c5fd', 0);
        addLatLabel(graticuleGroup, -60, '60°S', '#93c5fd', 0);

        // 经线大圆 (每 30° 一条，共 6 个大圆覆盖全球 12 个时区经线并标注)
        for (let lng = 0; lng < 180; lng += 30) {
            const isPrime = (lng === 0);
            graticuleGroup.add(createLongitudeCircle(lng, isPrime ? 0x38bdf8 : 0x60a5fa, isPrime ? 0.65 : 0.30));
        }

        addLngLabel(graticuleGroup, 0, '本初子午线 0°', '#38bdf8');
        addLngLabel(graticuleGroup, 30, '30°E', '#93c5fd');
        addLngLabel(graticuleGroup, 60, '60°E', '#93c5fd');
        addLngLabel(graticuleGroup, 90, '90°E', '#93c5fd');
        addLngLabel(graticuleGroup, 120, '120°E', '#93c5fd');
        addLngLabel(graticuleGroup, 150, '150°E', '#93c5fd');
        addLngLabel(graticuleGroup, 180, '180°', '#38bdf8');
        addLngLabel(graticuleGroup, -150, '150°W', '#93c5fd');
        addLngLabel(graticuleGroup, -120, '120°W', '#93c5fd');
        addLngLabel(graticuleGroup, -90, '90°W', '#93c5fd');
        addLngLabel(graticuleGroup, -60, '60°W', '#93c5fd');
        addLngLabel(graticuleGroup, -30, '30°W', '#93c5fd');

        earthMesh.add(graticuleGroup);

        // 背景星空微粒（调柔和：更小尺寸与更低不透明度）
        const starsGeom = new THREE.BufferGeometry();
        const starsCount = 200;
        const starsPositions = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i += 3) {
            starsPositions[i] = (Math.random() - 0.5) * 40;
            starsPositions[i+1] = (Math.random() - 0.5) * 40;
            starsPositions[i+2] = -10 - Math.random() * 20;
        }
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0x64748b, size: 0.035, transparent: true, opacity: 0.35 });
        const starField = new THREE.Points(starsGeom, starsMat);
        scene.add(starField);

        // 更新相机三维球面坐标与朝向
        function updateCameraPosition() {
            const x = CAMERA_DIST * Math.sin(Cn) * Math.cos(cr);
            const y = CAMERA_DIST * Math.cos(Cn);
            const z = CAMERA_DIST * Math.sin(Cn) * Math.sin(cr);
            camera.position.set(x, y, z);
            camera.lookAt(earthMesh.position);
        }

        // 视口与投影矩阵适配 (兼容手机竖屏与横屏)
        function updateCameraProjection() {
            const w = window.innerWidth || document.documentElement.clientWidth || 360;
            const h = window.innerHeight || document.documentElement.clientHeight || 640;
            const aspect = w / h;

            if (aspect < 1.0) {
                camera.left = -ot;
                camera.right = ot;
                camera.top = ot / aspect;
                camera.bottom = -ot / aspect;
            } else {
                camera.left = -ot * aspect;
                camera.right = ot * aspect;
                camera.top = ot;
                camera.bottom = -ot;
            }
            camera.updateProjectionMatrix();
        }

        function checkResize() {
            const w = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
            const h = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
            if (w > 0 && h > 0 && (w !== currentWidth || h !== currentHeight)) {
                currentWidth = w;
                currentHeight = h;
                updateCameraProjection();
                renderer.setSize(w, h);
            }
        }

        // 旋转相机视图
        function rotateCamera(deltaX, deltaY) {
            cr += deltaX * 0.008;
            Cn -= deltaY * 0.008;
            Cn = Math.max(Math.min(Cn, PI - 0.01), 0.01);
            updateCameraPosition();
        }

        // 缩放相机距离
        function zoomCamera(factor) {
            ot = Math.max(Math.min(ot * factor, MAX_ZOOM), MIN_ZOOM);
            updateCameraProjection();
        }

        // 重置相机视角
        function resetCameraView() {
            ot = DEFAULT_ZOOM;
            cr = PI / 2 + 0.35;
            Cn = PI / 2;
            updateCameraProjection();
            updateCameraPosition();
        }

        // 更新地球自转角度 (根据当前时间 UTC 分钟数)
        function updateEarthRotation(date) {
            const utcMinutes = date.getUTCHours() * 60 + date.getUTCMinutes() + date.getUTCSeconds() / 60;
            earthMesh.rotation.y = utcMinutes * Ep + Sp - PI / 2;
        }

        // 更新太阳光线倾斜角与晨昏线姿态（世界坐标系绝对同步，晨昏圈与阴影 100% 吻合）
        function updateSunPosition(date) {
            const declination = calculateSolarDeclination(date);
            sunLight.position.set(0, LIGHT_DIST * Math.sin(declination), LIGHT_DIST * Math.cos(declination));
            // Cylinder 默认轴沿 Y 轴，需先旋转 PI/2 对齐 Z 轴（太阳光照方向），再根据赤纬角精确俯仰
            terminatorRing.rotation.set(PI / 2 - declination, 0, 0);

            // 太阳直射点空间坐标动态更新 (位于面向太阳直射地表点 0, R*sin(δ), R*cos(δ))
            const subsolarY = 1.018 * Math.sin(declination);
            const subsolarZ = 1.018 * Math.cos(declination);
            subsolarCore.position.set(0, subsolarY, subsolarZ);
            subsolarHalo.position.set(0, subsolarY, subsolarZ);
            subsolarHalo.rotation.set(-declination, 0, 0);
            subsolarLabel.position.set(0, subsolarY + 0.055, subsolarZ + 0.02);

            if (typeof earthCustomMaterial !== 'undefined' && earthCustomMaterial.uniforms) {
                sunLight.updateWorldMatrix(true, false);
                const worldSunPos = new THREE.Vector3();
                sunLight.getWorldPosition(worldSunPos);
                earthCustomMaterial.uniforms.sunDirection.value.copy(worldSunPos).normalize();
            }
        }

        // 调整整体倾斜角
        function setTilt(angleOffset) {
            let tilt = earthGroup.rotation.x + angleOffset;
            tilt = Math.max(Math.min(tilt, PI / 2), -PI / 2);
            earthGroup.rotation.x = tilt;
            updateSunPosition(getCurrentDisplayDate());
        }

        // 赤道对齐
        function alignEquator() {
            earthGroup.rotation.x = 0;
            updateSunPosition(getCurrentDisplayDate());
        }

        // 黄道对齐
        function alignEcliptic() {
            const now = getCurrentDisplayDate();
            earthGroup.rotation.x = calculateSolarDeclination(now);
            updateSunPosition(now);
        }

        // 切换太阳直射点
        function toggleSubsolarPoint() {
            subsolarGroup.visible = !subsolarGroup.visible;
            return subsolarGroup.visible;
        }

        // 切换晨昏线
        function toggleTerminatorLine() {
            terminatorRing.visible = !terminatorRing.visible;
            return terminatorRing.visible;
        }

        // 切换经纬线
        function toggleGraticuleLine() {
            graticuleGroup.visible = !graticuleGroup.visible;
            return graticuleGroup.visible;
        }

        // 切换午时线
        function toggleMeridianLine() {
            const visible = !redMeridian.visible;
            redMeridian.visible = visible;
            blueMeridian.visible = visible;
            noonLabel.visible = visible;
            midnightLabel.visible = visible;
            return visible;
        }

        // 切换地轴
        function toggleEarthAxis() {
            earthAxis.visible = !earthAxis.visible;
            return earthAxis.visible;
        }

        function getCurrentDisplayDate() {
            return isSimulating && simulatedTime ? new Date(simulatedTime) : new Date();
        }

        // 触摸与手势事件监听
        function onTouchStart(e) {
            if (e.touches.length === 1) {
                isTouching = true;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isTouching = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                initialPinchDist = Math.hypot(dx, dy);
                initialZoom = ot;
            }
        }

        function onTouchMove(e) {
            if (e.touches.length === 1 && isTouching) {
                const deltaX = e.touches[0].clientX - lastTouchX;
                const deltaY = e.touches[0].clientY - lastTouchY;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                rotateCamera(deltaX, deltaY);
            } else if (e.touches.length === 2 && initialPinchDist > 0) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                const scale = initialPinchDist / dist;
                ot = Math.max(Math.min(initialZoom * scale, MAX_ZOOM), MIN_ZOOM);
                updateCameraProjection();
            }
        }

        function onTouchEnd(e) {
            if (e.touches.length === 0) {
                isTouching = false;
                initialPinchDist = 0;
            } else if (e.touches.length === 1) {
                isTouching = true;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                initialPinchDist = 0;
            }
        }

        // 鼠标拖动与滚轮
        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;
        function onMouseDown(e) {
            isMouseDown = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }
        function onMouseMove(e) {
            if (!isMouseDown) return;
            const deltaX = e.clientX - lastMouseX;
            const deltaY = e.clientY - lastMouseY;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            rotateCamera(deltaX, deltaY);
        }
        function onMouseUp() {
            isMouseDown = false;
        }
        function onWheel(e) {
            zoomCamera(e.deltaY > 0 ? 1.08 : 0.92);
        }

        window.addEventListener('touchstart', onTouchStart, { passive: false });
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('touchend', onTouchEnd, { passive: false });
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('wheel', onWheel, { passive: true });

        window.addEventListener('resize', checkResize);

        // 初始化
        const initialDate = new Date();
        updateEarthRotation(initialDate);
        updateSunPosition(initialDate);
        alignEcliptic();
        checkResize();
        updateCameraPosition();

        // 动画主循环
        let lastUpdateTime = 0;
        function animate(timestamp) {
            requestAnimationFrame(animate);
            checkResize();

            if (!lastUpdateTime || timestamp - lastUpdateTime >= 1000) {
                lastUpdateTime = timestamp;
                const now = getCurrentDisplayDate();
                updateEarthRotation(now);
                updateSunPosition(now);
            }

            renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);

        // 对外供 Android 原生层调用的 JS API
        window.earthSimulator = {
            toggleTerminator: function() { return toggleTerminatorLine(); },
            toggleSubsolar: function() { return toggleSubsolarPoint(); },
            toggleGraticule: function() { return toggleGraticuleLine(); },
            toggleMeridian: function() { return toggleMeridianLine(); },
            toggleAxis: function() { return toggleEarthAxis(); },
            alignEquator: function() { alignEquator(); },
            alignEcliptic: function() { alignEcliptic(); },
            resetCamera: function() { resetCameraView(); },
            tilt: function(delta) { setTilt(delta); },
            zoomIn: function() { zoomCamera(0.85); },
            zoomOut: function() { zoomCamera(1.15); },
            setTime: function(timeMillis) {
                isSimulating = true;
                simulatedTime = timeMillis;
                const d = new Date(timeMillis);
                updateEarthRotation(d);
                updateSunPosition(d);
            },
            resetToLiveTime: function() {
                isSimulating = false;
                simulatedTime = null;
                const d = new Date();
                updateEarthRotation(d);
                updateSunPosition(d);
            }
        };
    </script>
</body>
</html>
